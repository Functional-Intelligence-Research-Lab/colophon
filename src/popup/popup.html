<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colophon</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="topbar">
      <div class="brand-mark">
        <img src="../icons/green_doc.svg" alt="" width="20" height="20">
      </div>
      <h1 id="doc-title">Untitled document</h1>
      <div class="tooltip-container">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tooltip-icon">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span class="tooltip-text">Start recording before you edit document</span>
      </div>
      <button id="btn-settings" class="icon-button" type="button" aria-label="Open settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <section class="score-card" aria-label="Writing originality summary">
      <div class="summary" id="summary-banner">
        <div class="leaf-mark" id="verdict-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.5 4.5C11.8 4.5 6 8.9 6 15.5c0 1.1.3 2.1.8 3 1-.7 2.1-1.3 3.4-1.8 3-1.1 5.1-3 6.2-5.7-2.4 2-5.1 3-8.1 3.1 1.9-4 5.6-6.1 11.2-6.4v-3.2Z"/>
          </svg>
        </div>
        <div>
          <p class="summary-title" id="summary-title">Nothing recorded <strong>yet</strong></p>
        </div>
      </div>

      <div class="breakdown">
        <h2>Breakdown</h2>
        <div class="metric">
          <span>Own writing</span>
          <div class="bar"><span class="bar-fill bar-fill--own" id="bar-own"></span></div>
          <strong id="score-own">80%</strong>
        </div>
        <div class="metric">
          <span>AI Paraphrase</span>
          <div class="bar"><span class="bar-fill bar-fill--ai" id="bar-ai"></span></div>
          <strong id="score-ai">80%</strong>
        </div>
        <div class="metric">
          <span>External Source</span>
          <div class="bar"><span class="bar-fill bar-fill--source" id="bar-source"></span></div>
          <strong id="score-source">80%</strong>
        </div>
      </div>
    </section>

    <section class="activity-section">
      <h2>Recent Activity</h2>
      <div id="activity-list" class="activity-list"></div>
    </section>

    <button id="btn-record" class="record-button" type="button">Start recording</button>

    <button id="btn-full-log" class="log-row" type="button">
      <span class="doc-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 3h7l4 4v14H7V3Z"/>
          <path d="M14 3v5h5M9 13h6M9 17h5"/>
        </svg>
      </span>
      <span>View full log</span>
      <svg class="arrow-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </button>

    <footer class="footer">
      <div class="privacy">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="10" width="12" height="10" rx="2"/>
          <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10"/>
        </svg>
        <span>Private and local</span>
      </div>
      <button id="btn-export" class="export-link" type="button" title="Download this session as a .twff file">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span class="btn-label">Export</span>
      </button>
      <button id="btn-viewer" class="export-link" type="button" title="Open this session in the TWFF viewer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        <span class="btn-label">Viewer</span>
      </button>
      <button id="btn-floating" class="external-button" type="button" title="Float panel" aria-label="Float panel">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 5h5v5M13 11l6-6M19 14v5H5V5h5"/>
        </svg>
      </button>
    </footer>

    <p id="notice" class="notice" hidden></p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
