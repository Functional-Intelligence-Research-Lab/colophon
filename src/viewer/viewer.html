<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colophon Viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="viewer-header">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.53c-.22-.38-.59-.68-1.04-.81l-1.47-.43c-.45-.13-.79-.53-.79-1v-1c0-.55-.45-1-1-1h-2v-2h2c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1h-1.5l-2.4-2.4c.28-.04.57-.07.86-.07 4.97 0 9 4.03 9 9 0 1.48-.36 2.87-1 4.07z"/>
      </svg>
      <span class="brand-name">Colophon Viewer</span>
    </div>
    <label class="open-btn" for="file-input">Open .twff file</label>
    <input id="file-input" type="file" accept=".twff">
    <button id="btn-annotated-pdf" class="open-btn" disabled title="Load a .twff file to enable">Export Annotated PDF</button>
  </header>

  <div id="drop-zone" class="drop-zone">
    <div class="drop-content">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/>
        <polyline points="9 15 12 12 15 15"/>
      </svg>
      <p class="drop-label">Drag a <strong>.twff</strong> file here</p>
      <p class="drop-sub">or click <strong>Open .twff file</strong> above</p>
    </div>
  </div>

  <div id="viewer-content" class="viewer-content" hidden>
    <div class="session-bar" id="session-bar"></div>
    <div class="stats-row" id="stats-row"></div>
    <div class="timeline-wrap">
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <div id="error-banner" class="error-banner" hidden></div>

  <script type="module" src="./viewer.js"></script>
</body>
</html>
